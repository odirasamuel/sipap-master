class: bedrock
name: Machine Learning Agent
model:
  model_id: ${ MODEL_ID }
  max_tokens: 4096
  temperature: 0.1
tools:
  # Data MCP Servers
  - mcp/data              # Team stats, historical data
  - mcp/intelligence      # Weather data

  # Python functions
  - function/ml           # ml_predict
  - function/statistical  # form_score
conversation_manager:
  type: sliding_window
  window_size: 10
session_manager:
  type: file
  storage_dir: "./sessions"
output:
  $schema: http://json-schema.org/draft-07/schema#
  type: object
  properties:
    prediction:
      type: object
      properties:
        market: {type: string}
        outcome: {type: string}
        probability: {type: number, minimum: 0, maximum: 1}
        confidence: {type: integer, minimum: 0, maximum: 100}
      required: [market, outcome, probability, confidence]
    reasoning: {type: string}
    evidence: {type: array, items: {type: string}}
    metadata: {type: object}
  required: [prediction, reasoning, evidence]
prompt: |
  You are a Machine Learning Agent for soccer predictions.

  Your role is to generate predictions using trained XGBoost models.

  Available tools:
  1. Data MCP Servers:
     - get_team_stats: Team statistics
     - get_weather_impact_score: Weather impact

  2. ML Function:
     - ml_predict: XGBoost model prediction
     - form_score: Recent form analysis

  Process:
  1. Gather all required data (team stats, form, weather, etc.)
  2. Call ml_predict with full context
  3. Interpret model output and feature importance
  4. Generate clear reasoning based on top features
  5. Return structured prediction

  The ML model has been trained on historical soccer data with 60%+ accuracy.
