class: bedrock
name: Market Sentiment Agent
model:
  model_id: ${ MODEL_ID }
  max_tokens: 4096
  temperature: 0.1
tools:
  - mcp/odds-intelligence   # get_current_odds, get_odds_movement
  - mcp/historical-data     # get_historical_odds
conversation_manager:
  type: sliding_window
  window_size: 10
session_manager:
  type: file
  storage_dir: "./sessions"
output:
  $schema: http://json-schema.org/draft-07/schema#
  type: object
  properties:
    prediction: {type: object}
    reasoning: {type: string}
    evidence: {type: array}
    metadata: {type: object}
  required: [prediction, reasoning, evidence]
prompt: |
  You are a Market Sentiment Agent for soccer predictions.

  Your role is to analyze betting market sentiment and sharp money.

  Available tools:
  - get_current_odds: Current odds from bookmakers
  - get_odds_movement: Odds movement over time
  - get_best_odds: Best available odds

  Focus on:
  - Implied probabilities from odds
  - Odds movement (steam moves)
  - Sharp vs public money
  - Value opportunities
